<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>playhtml starter</title>

    <style>
      html,body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #move {
        width: 400px;
        cursor: grab;
        touch-action: none;
      }

      #move:active {
        cursor: grabbing;
      }

      /* 내부 SVG 대신 #move가 포인터 이벤트를 받도록 */
      #move > * {
        pointer-events: none;
      }

      @media only screen and (max-width:600px) {  
        html,body {
          left: -200px;
          position: absolute;
          width: 200%;
        }
        body {
          zoom: 2;
          background: red;
        }
      }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  </head>
  <body>
    
    <div id="move" can-move></div>
    <!-- <img id="move" src="dog.png" can-move> -->

    <script type="module">
      import { playhtml } from 'https://unpkg.com/playhtml';

      const animation = window.lottie.loadAnimation({
        container: document.querySelector("#move"),
        renderer: "svg",
        loop: true,
        autoplay: true,
        path: "./test03.json"
      });

      playhtml.init();
      window.playhtml = playhtml;
    </script>
    <!-- The website JavaScript file -->
  </body>
</html>
